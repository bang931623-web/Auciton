name: 2단계 - 경매물건 동기화 (매일 자동)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# data.json 을 저장소에 되커밋하려면 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python files/sync.py
        env:
          TZ: Asia/Seoul
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CONFIG_DB_ID: ${{ secrets.CONFIG_DB_ID }}
          RESULT_DB_ID: ${{ secrets.RESULT_DB_ID }}
          ON_SOLD: archive

      # 노션 표 3개 -> 보드용 docs/data.json
      - name: data.json 내보내기
        run: python files/export_json.py docs/data.json
        env:
          TZ: Asia/Seoul
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CONFIG_DB_ID: ${{ secrets.CONFIG_DB_ID }}
          RESULT_DB_ID: ${{ secrets.RESULT_DB_ID }}

      - name: data.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "data.json 갱신 $(date +%F)"
          git push
